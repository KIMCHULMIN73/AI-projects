<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>냉장고 재료 정리</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  <script type="module" src="library.js"></script>
</head>
<body>
  <header class="top">
    <h1>냉장고 재료 정리</h1>
    <p id="health" class="health" data-state="checking" aria-live="polite">서버 확인 중…</p>
    <!-- 3단계: 누구인지 항상 보인다 -->
    <div class="profile-bar">
      <button id="profile-toggle" type="button" aria-expanded="false" aria-controls="profile-menu"><span id="profile-current">프로필</span> ▾</button>
      <button id="library-link" type="button" class="library-link">보관함 <span id="library-count">0</span></button>
    </div>
  </header>

  <!-- 3단계: 프로필 전환 · 새 프로필 · 이름 수정 · 삭제 -->
  <section id="profile-menu" class="card profile-menu" aria-labelledby="profile-menu-title" hidden>
    <h2 id="profile-menu-title">프로필</h2>
    <ul id="profile-list" class="profile-list"></ul>
    <form id="rename-form">
      <label for="rename-input">지금 프로필 이름</label>
      <div class="row">
        <input id="rename-input" name="name" type="text" maxlength="20" required>
        <button type="submit">이름 저장</button>
      </div>
    </form>
    <form id="new-profile-form">
      <label for="new-profile-input">새 프로필</label>
      <div class="row">
        <input id="new-profile-input" name="name" type="text" maxlength="20" placeholder="이름 (예: 엄마)" required>
        <button type="submit">만들기</button>
      </div>
    </form>
    <div class="profile-danger">
      <button id="profile-delete" type="button">이 프로필 지우기</button>
      <span id="profile-delete-note" class="summary"></span>
    </div>
  </section>

  <main>
    <div id="store-error" class="error store-error" role="alert" hidden></div>

    <!-- ① 사진 올리기 → 미리보기 + 분석 -->
    <section class="card" aria-labelledby="photo-title">
      <h2 id="photo-title">냉장고 사진</h2>

      <label id="drop" class="drop" for="file">
        <input id="file" type="file" accept="image/*">
        <span class="drop-main">사진을 고르거나 여기에 끌어다 놓으세요</span>
        <span class="drop-sub">붙여넣기(Ctrl+V)도 됩니다</span>
      </label>

      <figure id="preview" class="preview" hidden>
        <img id="preview-img" alt="분석에 보낼 사진 미리보기">
        <figcaption id="preview-cap"></figcaption>
      </figure>

      <div class="actions">
        <button id="analyze" type="button" class="primary" disabled>재료 분석</button>
        <button id="cancel" type="button" hidden>취소</button>
      </div>

      <div id="status" class="status" aria-live="polite" data-state="idle">냉장고 사진을 올려 주세요. 분석은 보통 20초쯤 걸립니다.</div>
      <!-- 매초 바뀌므로 낭독기가 읽지 않게 live 영역 밖에 둔다 -->
      <div id="elapsed" class="elapsed" aria-hidden="true"></div>
      <div id="error" class="error" role="alert" hidden>
        <span id="error-msg"></span>
        <button id="retry" type="button" hidden>다시 시도</button>
      </div>

      <p class="privacy">사진은 분석을 위해 OpenRouter로 전송되며, 이 앱은 사진을 저장하지 않습니다.</p>
    </section>

    <!-- ② 재료 목록 — 편집 가능 -->
    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title" tabindex="-1">재료 목록</h2>
        <p id="summary" class="summary"></p>
      </div>

      <p id="empty" class="empty">아직 재료가 없습니다. 사진을 분석하거나 아래에서 직접 추가하세요.</p>
      <div id="groups"></div>

      <div id="unsure-box" class="unsure" hidden>
        <h3>이런 것도 있는 것 같은데 무엇인가요?</h3>
        <ul id="unsure-list"></ul>
      </div>

      <form id="add-form" class="add-form">
        <h3>직접 추가</h3>
        <div class="row">
          <input name="name" type="text" placeholder="이름 (예: 대파)" maxlength="40" required aria-label="재료 이름">
          <input name="quantity" type="text" placeholder="수량 (예: 2대)" maxlength="40" aria-label="수량">
          <select name="category" aria-label="카테고리"></select>
          <button type="submit">추가</button>
        </div>
      </form>
    </section>

    <!-- ③ 레시피 추천 — 재료를 고치고 다시 누르며 시험해 보는 곳 -->
    <section class="card" aria-labelledby="recipe-title">
      <h2 id="recipe-title">레시피 추천</h2>
      <p id="recipe-hint" class="summary"></p>

      <div class="actions">
        <button id="recommend" type="button" class="primary" disabled>레시피 추천</button>
        <button id="recipe-cancel" type="button" hidden>취소</button>
      </div>

      <div id="recipe-status" class="status" aria-live="polite" data-state="idle" hidden></div>
      <div id="recipe-elapsed" class="elapsed" aria-hidden="true"></div>
      <div id="recipe-error" class="error" role="alert" hidden>
        <span id="recipe-error-msg"></span>
        <button id="recipe-retry" type="button" hidden>다시 시도</button>
      </div>

      <p id="recipe-used" class="summary recipe-used" hidden></p>
      <div id="recipes" class="recipes"></div>
    </section>

    <!-- ④ 보관함 (3단계) — 지금 프로필이 저장한 레시피 -->
    <section id="library" class="card" aria-labelledby="library-title" tabindex="-1">
      <div class="list-head">
        <h2 id="library-title">보관함</h2>
        <p id="library-owner" class="summary"></p>
      </div>
      <p id="library-empty" class="empty">아직 저장한 레시피가 없습니다. 레시피 카드의 [저장]을 누르세요.</p>
      <ul id="library-list" class="library-list"></ul>
    </section>
  </main>

  <template id="item-tpl">
    <li class="item">
      <input class="i-name" type="text" maxlength="40" aria-label="재료 이름">
      <input class="i-qty" type="text" maxlength="40" aria-label="수량">
      <select class="i-cat" aria-label="카테고리"></select>
      <button class="badge" type="button" hidden>확인 필요</button>
      <button class="i-del" type="button" aria-label="삭제">삭제</button>
    </li>
  </template>
</body>
</html>
