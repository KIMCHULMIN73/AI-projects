<!-- ── 게임 화면 ─────────────────────────────────────────────── -->
<section id="screen-play" class="screen" hidden>
  <div class="panel panel-play">
    <header class="topbar">
      <div class="topbar-item">
        <span class="topbar-label">도전자</span>
        <span class="topbar-value" id="hudName">—</span>
      </div>
      <div class="topbar-item">
        <span class="topbar-label">진행</span>
        <span class="topbar-value" id="hudProgress">0 / 40</span>
      </div>
      <div class="topbar-item topbar-score">
        <span class="topbar-label">점수</span>
        <span class="topbar-value" id="hudScore">100</span>
      </div>
    </header>

    <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="40" aria-valuenow="0">
      <div class="progress-fill" id="hudProgressBar"></div>
    </div>

    <div class="question-area">
      <p class="question-category" id="questionCategory">
        <span class="qc-icon" aria-hidden="true"></span><span class="qc-label"></span>
      </p>
      <h2 class="question-text" id="questionText">문제가 여기에 표시됩니다.</h2>
      <!-- 보기 버튼은 data-index만 갖고, 클릭 바인딩은 main.js가 한다 -->
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <!-- 정답/오답 팝업 -->
  <div class="feedback-overlay" id="feedbackOverlay" hidden>
    <div class="feedback-popup" id="feedbackPopup" role="alertdialog" aria-live="assertive">
      <div class="feedback-mark" id="feedbackMark" aria-hidden="true">○</div>
      <p class="feedback-title" id="feedbackTitle">정답!</p>
      <p class="feedback-delta" id="feedbackDelta">+10</p>
      <p class="feedback-answer" id="feedbackAnswer" hidden></p>
      <div class="feedback-explanation">
        <span class="explanation-badge">해설</span>
        <p id="feedbackExplanation"></p>
      </div>
      <button class="btn btn-next" type="button" id="nextBtn">다음 문제 →</button>
    </div>
  </div>
</section>

<!-- ── 완료 화면 ─────────────────────────────────────────────── -->
<section id="screen-result" class="screen" hidden>
  <div class="panel">
    <div class="result-trophy" aria-hidden="true">🏆</div>
    <h2 class="result-title">게임 종료</h2>
    <p class="result-player" id="resultPlayer"></p>

    <div class="result-stats">
      <div class="stat stat-highlight">
        <span class="stat-value" id="resultScore">—</span>
        <span class="stat-label">최종 점수</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="resultCorrect">—</span>
        <span class="stat-label">정답 수</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="resultAccuracy">—</span>
        <span class="stat-label">정답률</span>
      </div>
    </div>

    <h3 class="section-title">분야별 정답률</h3>
    <ul class="category-scores" id="categoryScores"></ul>

    <div class="button-row">
      <button class="btn btn-primary" type="button" id="retryBtn">다시 도전</button>
      <button class="btn btn-secondary" type="button" id="finishBtn">종료</button>
    </div>
  </div>
</section>

<!-- ── 랭킹 화면 ─────────────────────────────────────────────── -->
<section id="screen-ranking" class="screen" hidden>
  <div class="panel">
    <h2 class="ranking-title"><span aria-hidden="true">🏅</span> 명예의 전당</h2>
    <p class="app-subtitle">지금까지 도전한 모든 기록</p>

    <div class="ranking-table-wrap">
      <table class="ranking-table">
        <thead>
          <tr><th scope="col">순위</th><th scope="col">이름</th><th scope="col">점수</th></tr>
        </thead>
        <tbody id="rankingBody"></tbody>
      </table>
    </div>

    <div class="button-row">
      <button class="btn btn-primary" type="button" id="restartBtn">다시 시작하기</button>
    </div>
  </div>
</section>

<!-- file://로 열면 브라우저가 ES Modules import를 CORS로 막아 main.js가 아예 로드되지 않는다.
     그러면 버튼이 하나도 동작하지 않는데 화면상으로는 멀쩡해 보여서 원인을 알기 어렵다.
     그래서 module이 아닌 일반 script로(=file://에서도 실행됨) 먼저 확인해 안내를 띄운다. -->
<script>
(function () {
  if (location.protocol !== 'file:') return;

  var box = document.createElement('div');
  box.setAttribute('role', 'alert');
  box.style.cssText = [
    'position:fixed', 'inset:0', 'z-index:9999', 'display:flex',
    'align-items:center', 'justify-content:center', 'padding:24px',
    'background:rgba(12,14,30,.94)', 'backdrop-filter:blur(4px)',
    'font-family:system-ui,-apple-system,sans-serif', 'color:#fff'
  ].join(';');

  box.innerHTML =
    '<div style="max-width:560px;background:#fff;color:#1f2233;border-radius:22px;' +
    'padding:34px 32px;box-shadow:0 30px 80px rgba(0,0,0,.5)">' +
      '<div style="font-size:3rem;line-height:1;text-align:center">🚧</div>' +
      '<h2 style="text-align:center;margin:12px 0 6px;font-size:1.4rem">' +
        '로컬 서버로 열어 주세요</h2>' +
      '<p style="text-align:center;color:#5b6070;font-size:.95rem;line-height:1.6;margin-bottom:20px">' +
        '이 게임은 ES Modules로 만들어져 있어서 파일을 직접 열면(<code>file://</code>) ' +
        '브라우저 보안 정책에 막혀 동작하지 않습니다.<br>' +
        '터미널에서 아래를 실행한 뒤 안내되는 주소로 접속하세요.</p>' +
      '<pre style="background:#f6f7fc;border-radius:12px;padding:16px 18px;margin:0;' +
