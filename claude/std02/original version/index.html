<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">오늘의 할 일</h1>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <p class="progress-text" id="progressText">완료 0 / 전체 0</p>
    </header>

    <section class="input-area">
      <input
        type="text"
        id="todoInput"
        class="todo-input"
        placeholder="할 일을 입력하세요"
      >
      <select id="categorySelect" class="category-select">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <input
        type="time"
        id="startTimeInput"
        class="start-time-input"
        aria-label="시작 시간"
      >
      <input
        type="number"
        id="durationInput"
        class="duration-input"
        min="1"
        placeholder="소요(분)"
        aria-label="소요 시간(분)"
      >
      <button type="button" id="addBtn" class="add-btn">추가</button>
    </section>

    <nav class="filter-tabs">
      <button type="button" class="filter-tab active" data-filter="all">전체</button>
      <button type="button" class="filter-tab" data-filter="work">업무</button>
      <button type="button" class="filter-tab" data-filter="personal">개인</button>
      <button type="button" class="filter-tab" data-filter="study">공부</button>
    </nav>

    <div class="list-toolbar">
      <button type="button" id="clearCompletedBtn" class="clear-completed-btn">완료 항목 지우기</button>
    </div>

    <main class="todo-list" id="todoList">
      <!-- 할 일 항목이 여기에 렌더링됩니다 -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
